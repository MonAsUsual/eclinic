<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eClinic Patient Dashboard</title>

<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f5f9fc;color:#19324d}

nav{
    background:white;padding:18px 7%;
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid #dce8f2;
    box-shadow:0 2px 10px #dce5ec
}
.logo{font-size:27px;font-weight:bold;color:#1261a0}
.logo span{color:#d62828}

.logout{
    text-decoration:none;color:#d62828;
    border:1px solid #d62828;padding:9px 18px;
    border-radius:5px;font-weight:bold
}

.container{width:90%;max-width:1000px;margin:40px auto}

.welcome{
    background:#1261a0;color:white;padding:35px;
    border-radius:10px;margin-bottom:25px
}
.welcome h1{margin:0 0 8px}

.card{
    background:white;padding:35px;border-radius:10px;
    border-top:4px solid #1261a0;
    box-shadow:0 5px 20px #dce7f0;
    text-align:center
}
.card h2{color:#1261a0}
.card p{color:#718394}

.button{
    display:inline-block;padding:14px 30px;
    background:#1261a0;color:white;
    text-decoration:none;border-radius:5px;font-weight:bold
}
</style>
</head>

<body>

<nav>
<div class="logo">e<span>Clinic</span> Hospital</div>
<a href="/logout" class="logout">Logout</a>
</nav>

<div class="container">

<div class="welcome">
<h1>Welcome, {{ first_name }}!</h1>
<p>Welcome to your eClinic patient portal.</p>
</div>

<div class="card">
<h2>🏥 Book a Medical Appointment</h2>
<p>Schedule your appointment with one of our available doctors.</p>
<a href="/appointment" class="button">Book Appointment</a>
</div>

</div>

</body>
</html>
