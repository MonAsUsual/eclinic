<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eClinic - Appointment</title>

<style>
*{box-sizing:border-box;font-family:Arial}
body{
margin:0;padding:40px 0;min-height:100vh;
background:linear-gradient(135deg,#eaf6ff,#fff)
}
.box{
width:550px;max-width:92%;margin:auto;background:white;
padding:35px;border-radius:12px;
border-top:5px solid #1261a0;
box-shadow:0 15px 40px #d6e3ec
}
.logo{text-align:center;font-size:30px;font-weight:bold;color:#1261a0}
.logo span{color:#d62828}
.subtitle{text-align:center;color:#718394}
h2{text-align:center;color:#19324d;margin:25px 0}
label{
display:block;color:#1261a0;font-weight:bold;
margin:15px 0 6px
}
select,input{
width:100%;padding:13px;
border:1px solid #ccdce8;border-radius:5px;
background:white
}
select:focus,input:focus{outline:2px solid #1261a0}
button{
width:100%;padding:14px;margin-top:25px;
border:0;border-radius:5px;
background:#1261a0;color:white;font-weight:bold
}
</style>
</head>

<body>

<div class="box">

<div class="logo">e<span>Clinic</span></div>
<p class="subtitle">Hospital Appointment System</p>

<h2>🏥 Book Medical Appointment</h2>

<form method="POST">

<label>Doctor</label>
<select name="doctor" required>
<option value="">Select Doctor</option>
<option>Dr. Juan Cruz</option>
<option>Dr. Maria Santos</option>
<option>Dr. Carlo Reyes</option>
</select>

<label>Department</label>
<select name="department" required>
<option value="">Select Department</option>
<option>General Medicine</option>
<option>Dental</option>
<option>Pediatrics</option>
<option>Laboratory</option>
</select>

<label>Appointment Date</label>
<input type="date" name="appointment_date" required>

<label>Appointment Time</label>
<select name="appointment_time" required>
<option value="">Select Time</option>
<option>8:00 AM</option>
<option>9:00 AM</option>
<option>10:00 AM</option>
<option>11:00 AM</option>
<option>1:00 PM</option>
<option>2:00 PM</option>
<option>3:00 PM</option>
<option>4:00 PM</option>
</select>

<label>Reason for Visit</label>
<select name="reason" required>
<option value="">Select Reason</option>
<option>Medical Check-up</option>
<option>Follow-up</option>
<option>Consultation</option>
<option>Dental Check-up</option>
<option>Laboratory Test</option>
</select>

<button type="submit">Confirm Appointment</button>

</form>
</div>

</body>
</html>
