<!DOCTYPE html>
<html>

<head>

    <title>Book Appointment - eClinic</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f8fb;
            margin: 0;
        }

        .header {
            background: #1976d2;
            color: white;
            padding: 20px 8%;
        }

        .container {
            width: 450px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            color: #123b63;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #125ca8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #1976d2;
        }

    </style>

</head>

<body>

    <div class="header">

        <h2 style="color:white;">
            eClinic
        </h2>

    </div>


    <div class="container">

        <h2>
            Book an Appointment
        </h2>


        <form method="POST">

            <label>
                Full Name
            </label>

            <input
                type="text"
                name="full_name"
                placeholder="Enter your full name"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>
                Appointment Date
            </label>

            <input
                type="date"
                name="appointment_date"
                required
            >


            <label>
                Appointment Time
            </label>

            <input
                type="time"
                name="appointment_time"
                required
            >


            <label>
                Reason for Visit
            </label>

            <input
                type="text"
                name="reason"
                placeholder="Example: Medical Check-up"
                required
            >


            <button type="submit">
                Book Appointment
            </button>

        </form>


        <a href="/" class="back">
            Back to Home
        </a>

    </div>

</body>

</html>
