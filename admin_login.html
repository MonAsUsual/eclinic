<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eClinic - Hospital Admin</title>

<style>
*{box-sizing:border-box;font-family:Arial}
body{
margin:0;min-height:100vh;
display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#eaf6ff,#fff)
}
.box{
width:420px;max-width:92%;background:white;
padding:35px;border-radius:12px;
border-top:5px solid #1261a0;
box-shadow:0 15px 40px #d6e3ec
}
.logo{text-align:center;font-size:31px;font-weight:bold;color:#1261a0}
.logo span{color:#d62828}
.subtitle{text-align:center;color:#718394}
h2{text-align:center;color:#19324d;margin-top:28px}
input{
width:100%;padding:13px;margin:7px 0;
border:1px solid #ccdce8;border-radius:5px
}
input:focus{outline:2px solid #1261a0}
button{
width:100%;padding:13px;margin-top:12px;
border:0;border-radius:5px;
background:#1261a0;color:white;font-weight:bold
}
</style>
</head>

<body>

<div class="box">

<div class="logo">e<span>Clinic</span></div>
<p class="subtitle">Hospital Administration Portal</p>

<h2>Administrator Login</h2>

<form action="/admin/login" method="POST">

<input type="email" name="email" placeholder="Admin Email" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Login to Admin Portal</button>

</form>

</div>

</body>
</html>
