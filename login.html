<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eClinic - Patient Portal</title>

<style>
*{box-sizing:border-box;font-family:Arial}
body{
    margin:0;min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#eaf6ff,#fff)
}
.box{
    width:430px;max-width:92%;background:white;
    padding:35px;border-radius:12px;
    border-top:5px solid #1261a0;
    box-shadow:0 15px 40px #d6e3ec
}
.logo{text-align:center;font-size:31px;font-weight:bold;color:#1261a0}
.logo span{color:#d62828}
.subtitle{text-align:center;color:#718394;margin:8px 0 25px}
.tabs{display:flex;margin-bottom:25px}
.tabs button{
    width:50%;padding:12px;border:0;
    background:#eaf4fb;color:#1261a0;font-weight:bold
}
.tabs button.active{background:#1261a0;color:white}
.form{display:none}
.form.active{display:block}
h2{text-align:center;color:#19324d}
.name{display:flex;gap:8px}
input{
    width:100%;padding:13px;margin:6px 0;
    border:1px solid #ccdce8;border-radius:5px
}
input:focus{outline:2px solid #1261a0}
.form button[type=submit]{
    width:100%;padding:13px;margin-top:12px;
    border:0;border-radius:5px;
    background:#1261a0;color:white;font-weight:bold
}
@media(max-width:500px){.name{display:block}}
</style>

<script>
function showForm(id,btn){
document.querySelectorAll(".form").forEach(x=>x.classList.remove("active"));
document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
document.getElementById(id).classList.add("active");
btn.classList.add("active");
}
</script>
</head>

<body>

<div class="box">

<div class="logo">e<span>Clinic</span></div>
<div class="subtitle">Patient Portal</div>

<div class="tabs">
<button class="active" onclick="showForm('login',this)">Patient Login</button>
<button onclick="showForm('register',this)">Register</button>
</div>

<div id="login" class="form active">

<h2>Patient Login</h2>

<form action="/login" method="POST">

<input type="email" name="email" placeholder="Email Address" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>
</div>

<div id="register" class="form">

<h2>Create Patient Account</h2>

<form action="/register" method="POST">

<div class="name">
<input type="text" name="first_name" placeholder="First Name" required>
<input type="text" name="last_name" placeholder="Last Name" required>
</div>

<input type="email" name="email" placeholder="Email Address" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Create Account</button>

</form>
</div>

</div>
</body>
</html>
